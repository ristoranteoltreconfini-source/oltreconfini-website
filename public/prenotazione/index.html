// conferma dentro la pagina (niente finestre del browser: più chiaro sul telefono)
function chiedi(){ var x = $('#x'); var box = document.createElement('div'); box.className = 'ask';
  box.innerHTML = '<p>' + esc(T('m_sure')) + '</p><div class="mins"><button type="button" class="s" id="si">' + esc(T('yes')) + '</button><button type="button" id="nn">' + esc(T('no')) + '</button></div>';
  x.replaceWith(box); $('#si').addEventListener('click', function(){ fai({a:'annulla', t:TOK}); }); $('#nn').addEventListener('click', function(){ mostra(stato); }); }
function fai(body){
  Array.prototype.forEach.call(document.querySelectorAll('#b button'), function(x){ x.disabled = true; });
  json(URL_, {method:'POST', body: JSON.stringify(body)}).then(function(r){
    if (r && r.err === 'stato') return carica();
    if (!r || !r.ok) return mostra({ok:false, err: r && r.err === 'tardi' ? 'tardi' : r && r.err === 'link' ? 'link' : 'net'});
    mostra(r, r.fatto === 'annulla' ? T('m_cancelled') : r.fatto === 'qui' ? T('m_qui') : T('m_eta_ok', {h: r.eta}));
  }).catch(function(){ mostra({ok:false, err:'net'}); });
}
function carica(){ msg(T('m_load')); json(URL_ + '?a=pren&t=' + encodeURIComponent(TOK)).then(function(d){ mostra(d || {ok:false, err:'net'}); }).catch(function(){ mostra({ok:false, err:'net'}); }); }
testi();
try { var q = new URLSearchParams(location.search); TOK = q.get('t') || q.get('pren') || ''; } catch(e) {}
if (!/^\d{8}[a-f0-9]{32}$/.test(TOK)) { msg(T('m_link')); return; }
msg(T('m_load'));
fetch(IMP + '&_=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.text(); }).then(function(t){
  var rows = csv(t), r = rows.filter(function(x){ return /^opinioni$/i.test(String(x[0] || '').trim()); })[0], u = r ? String(r[1] || '').trim() : '';
  var tl = rows.filter(function(x){ return /^telefono/i.test(String(x[0] || '').trim()); })[0]; if (tl && /^\+?[\d\s]{8,}$/.test(String(tl[1] || '').trim())) TEL = String(tl[1]).trim();
  if (!/^(https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec|\/api)$/.test(u)) throw new Error('url');
  URL_ = u; testi(); carica();
}).catch(function(){ mostra({ok:false, err:'net'}); });
})();
</script>
